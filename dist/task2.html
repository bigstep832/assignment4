  <link rel="stylesheet" href="assets/styles.css">

</head>
<body data-task="2">
  <a class="skip-link" href="#main">Skip to form</a>
  <div class="container page-container">
    <header class="site-header">
      <nav class="task-nav" aria-label="Assignment tasks">
        <a href="task0.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a class="active" aria-current="page" href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="index.html">Task 4</a>
      </nav>
    </header>

    <main id="main">
      <h1 id="task-title">Task 2: Bootstrap Contact Form</h1>
      <section class="form-section" aria-labelledby="task-title">
        <form id="contact-form" class="row g-3" data-mode="native" data-success="Form completed successfully.">
          <div class="col-md-6">
            <label class="form-label" for="task2-name">Full name <span class="required-mark" aria-hidden="true">*</span></label>
            <input class="form-control" id="task2-name" name="name" type="text" placeholder="Zhadiger Saken" autocomplete="name" required maxlength="80" aria-describedby="task2-name-help">
            <div class="form-text" id="task2-name-help">The name we should use when replying.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="task2-email">Email address <span class="required-mark" aria-hidden="true">*</span></label>
            <input class="form-control" id="task2-email" name="email" type="email" placeholder="zhadiger@example.com" autocomplete="email" required maxlength="254" aria-describedby="task2-email-help">
            <div class="form-text" id="task2-email-help">Use an email address you can access.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="task2-message">Message <span class="required-mark" aria-hidden="true">*</span></label>
            <textarea class="form-control" id="task2-message" name="message" rows="5" placeholder="Tell us what is on your mind…" required minlength="10" maxlength="1000" aria-describedby="task2-message-help"></textarea>
            <div class="form-text" id="task2-message-help">A little detail helps. Write 10–1,000 characters.</div>
          </div>
          <div class="col-12 form-actions">
            <button class="btn btn-primary" type="submit">Send message</button>
          </div>
          <div class="col-12"><div class="form-status" role="status" aria-live="polite" hidden></div></div>
        </form>
      </section>

      </main>

    </div>
</body>
</html>
