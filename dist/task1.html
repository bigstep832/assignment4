    <main id="main">
      <h1 id="task-title">Task 1: HTML5 Validation</h1>
      <section class="form-section" aria-labelledby="task-title">
        <form id="contact-form" class="basic-form" data-mode="native" data-success="Form completed successfully.">
          <div class="field-group">
            <label for="task1-name">Full name <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="task1-name" name="name" type="text" autocomplete="name" required maxlength="80" aria-describedby="task1-name-help">
            <p id="task1-name-help" class="field-help">Up to 80 characters.</p>
          </div>
          <div class="field-group">
            <label for="task1-email">Email address <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="task1-email" name="email" type="email" autocomplete="email" required maxlength="254" aria-describedby="task1-email-help">
            <p id="task1-email-help" class="field-help">Enter an email address such as zhadiger@example.com.</p>
          </div>
          <div class="field-group">
            <label for="task1-message">Message <span class="required-mark" aria-hidden="true">*</span></label>
            <textarea id="task1-message" name="message" rows="5" required minlength="10" maxlength="1000" aria-describedby="task1-message-help"></textarea>
            <p id="task1-message-help" class="field-help">Write between 10 and 1,000 characters.</p>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Send message</button>
          </div>
          <div class="form-status" role="status" aria-live="polite" hidden></div>
        </form>
      </section>

      </main>
