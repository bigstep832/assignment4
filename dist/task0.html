    <main id="main">
      <h1 id="task-title">Task 0: Basic Contact Form</h1>
      <section class="form-section" aria-labelledby="task-title">
        <form id="contact-form" class="basic-form" data-mode="basic" data-success="Form completed successfully.">
          <div class="field-group">
            <label for="task0-name">Full name</label>
            <input id="task0-name" name="name" type="text" autocomplete="name">
          </div>
          <div class="field-group">
            <label for="task0-email">Email address</label>
            <input id="task0-email" name="email" type="email" autocomplete="email">
          </div>
          <div class="field-group">
            <label for="task0-message">Message</label>
            <textarea id="task0-message" name="message" rows="5"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Send message</button>
          </div>
          <div class="form-status" role="status" aria-live="polite" hidden></div>
        </form>
      </section>
